[theme]
primaryColor = "#8b5cf6"
backgroundColor = "#0b0d14"
secondaryBackgroundColor = "#141724"
textColor = "#e2e8f0"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 500
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false

